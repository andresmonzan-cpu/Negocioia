<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NegocioIA</title>
</head>
<body>

  <h1>NegocioIA</h1>
  <p>Escribe lo que necesites y prepara tu idea.</p>

  <textarea id="idea" placeholder="Escribe aquí"></textarea>
  <br><br>
  <button onclick="generar()">Generar</button>

  <p id="resultado"></p>

  <script>
    function generar() {
      const idea = document.getElementById("idea").value;
      const resultado = document.getElementById("resultado");

      if (idea.trim() === "") {
        resultado.textContent = "Escribe una idea primero.";
      } else {
        resultado.textContent = "Solicitud recibida: " + idea;
      }
    }
  </script>

</body>
</html>
